<!doctype html><meta charset="utf-8"><title>Проверка моделей помощника</title>
<script src="../static/pwa/local-ai.js"></script>
<h1>Проверка всех локальных моделей</h1><button id="run">Проверить четыре модели</button><p id="status"></p><pre id="result" style="white-space:pre-wrap"></pre>
<script>
const status=document.getElementById('status');
const context='Занятие 1. Ввод и вывод данных. Задача «Площадь прямоугольного треугольника». Условие: Напишите программу, которая считывает длины двух катетов в прямоугольном треугольнике и выводит его площадь. Каждое число записано в отдельной строке.';
const learningContext='Начинающий ученик занимается прямо в Питонтьюторе. На этом уроке изучены input(), int(), print(), переменные и арифметика. Решения проверяются в браузере.';
const cases=[
 {id:'input_types',context:'Задача «Сумма двух чисел». Введите два целых числа, каждое с новой строки. Выведите сумму.',question:'Ввожу 2 и 3, а получаю 23. Почему? Помоги найти причину в коде, не пиши всю программу.',code:'a=input()\nb=input()\nprint(a+b)'},
 {id:'last_digit',context:'Задача «Последняя цифра». Дано натуральное число. Выведите его последнюю цифру.',question:'Для 57 получаю 5, а нужна 7. Какой оператор я перепутал и почему?',code:'n=int(input())\nprint(n//10)'},
 {id:'loop_boundary',context:'Задача «Сумма чисел от 1 до n». Введите натуральное n и выведите сумму всех чисел от 1 до n включительно.',question:'При n=3 получаю 3 вместо 6. Где ошибка в границах цикла? Объясни без готовой программы.',code:'n=int(input())\ns=0\nfor i in range(1,n):\n    s+=i\nprint(s)'}
];
run.onclick=async()=>{
 run.disabled=true;const records=[];
 for(const model of TutorLocalAI.choices){
  status.textContent='Загрузка '+model.label;
  const start=performance.now();let timer=setTimeout(()=>TutorLocalAI.stop(),240000);
  try{
   await TutorLocalAI.load(model.id,t=>status.textContent=model.label+': '+t);clearTimeout(timer);
   records.push({model:model.id,loadSeconds:Math.round((performance.now()-start)/1000)});
   for(const test of cases){
    status.textContent=model.label+' / '+test.id;
    const t=performance.now();
    try{const answer=await TutorLocalAI.answer(model.id,{context,learningContext,turns:[],solved:false,...test},()=>{});records.push({model:model.id,test:test.id,seconds:Math.round((performance.now()-t)/1000),answer});}
    catch(e){records.push({model:model.id,test:test.id,error:e.message});}
    result.textContent=JSON.stringify(records,null,2);
   }
  }catch(e){clearTimeout(timer);records.push({model:model.id,error:e.message});result.textContent=JSON.stringify(records,null,2);}
 }
 status.textContent='DONE';run.disabled=false;
};
</script>
