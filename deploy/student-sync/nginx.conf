limit_req_zone $binary_remote_addr zone=pt_sync:1m rate=8r/s;
server {
 listen 8443 ssl;
 server_name 109.196.164.69;
 ssl_certificate /opt/pythontutor-sync/server.pem;
 ssl_certificate_key /opt/pythontutor-sync/server.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 4m;
 access_log off;
 location = /progress {
  limit_req zone=pt_sync burst=30 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:18442;
 }
 location / { return 404; }
}
