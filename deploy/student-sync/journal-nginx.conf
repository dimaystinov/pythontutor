server {
 listen 9443 ssl;
 server_name 109-196-164-69.sslip.io;
 ssl_certificate /etc/letsencrypt/live/109-196-164-69.sslip.io/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/109-196-164-69.sslip.io/privkey.pem;
 ssl_client_certificate /opt/pythontutor-sync/owner-ca.pem;
 ssl_verify_client on;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 add_header Cache-Control "no-store" always;
 add_header Referrer-Policy "no-referrer" always;
 add_header X-Frame-Options "DENY" always;
 add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; style-src 'self' 'unsafe-inline'; form-action 'self'; base-uri 'none'" always;
 root /opt/pythontutor-sync/journal-ui;
 index journal.html;
 location = /journal {
  limit_req zone=pt_sync burst=15 nodelay;
  proxy_pass http://127.0.0.1:18442;
 }
 location / { try_files $uri $uri/ =404; }
}
