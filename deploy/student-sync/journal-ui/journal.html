<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Журнал PythonTutor</title>
<style>*{box-sizing:border-box}body{font:16px/1.5 system-ui;color:#203044;max-width:78rem;margin:auto;padding:1.2rem}h1{font-size:1.7rem}input,button,select{font:inherit;padding:.4rem .6rem}label{display:inline-block;margin:.3rem}button{cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #cbd8df;padding:.5rem}thead{background:#ecf4fb}.scroll{overflow:auto}#status{min-height:1.5em}small{color:#455769}button:disabled{cursor:wait}</style>
<h1>Журнал PythonTutor</h1><form id="login"><label>Ключ преподавателя <input id="key" type="password" required autocomplete="off"></label><button>Открыть журнал</button></form>
<section id="panel" hidden><label>Группа <select id="group"><option value="">Все группы</option><option value="1">1 группа</option><option value="2">2 группа</option><option value="3">3 группа</option></select></label> <label>Дата <input id="day" type="date"></label> <button id="refresh">Обновить</button> <button id="lock">Закрыть журнал</button>
<p id="counts"></p><div class="scroll"><table><thead><tr><th>Ученик</th><th>Группа</th><th>Класс</th><th>Решено</th><th>В работе</th><th>Работа за дату</th><th>Явка в личном журнале</th></tr></thead><tbody></tbody></table></div>
<small>«Работал» появляется после синхронизации попытки. Дата — московская. Явку подтверждает преподаватель.</small></section><p id="status" role="status"></p>
<script src="teacher.js"></script><script src="journal.js"></script></html>
