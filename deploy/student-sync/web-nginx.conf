server {
 listen 443 ssl;
 server_name 109-196-164-69.sslip.io;
 ssl_certificate /etc/letsencrypt/live/109-196-164-69.sslip.io/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/109-196-164-69.sslip.io/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 4m;
 access_log off;
 location = /progress {
  add_header Access-Control-Allow-Origin "https://dimaystinov.github.io" always;
  add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Content-Type" always;
  add_header Cache-Control "no-store" always;
  if ($request_method = OPTIONS) { return 204; }
  limit_req zone=pt_sync burst=45 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:18442;
 }
 location / { return 404; }
}
