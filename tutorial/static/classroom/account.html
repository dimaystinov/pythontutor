<section hidden id="class-account" class="settings-section"><h2>Профиль ученика</h2>
<p data-name></p><button data-logout hidden class="btn btn-default">Выйти</button>
<form><p>Можно заниматься гостем. Войдите, чтобы продолжить с теми же решениями в приложении или другом браузере.</p>
<label>Имя <input name="given" maxlength="40" required></label>
<label>Фамилия <input name="surname" maxlength="40" required></label>
<label>Класс <input name="grade" placeholder="1–11" inputmode="numeric" pattern="([1-9]|1[01])" required size="3"></label>
<label>Пароль <input name="password" type="password" minlength="8" autocomplete="current-password" required></label>
<button class="btn btn-primary">Войти</button></form><p id="class-status" role="status"></p>
<a href="../static/classroom/journal.html">Журнал преподавателя</a></section>
