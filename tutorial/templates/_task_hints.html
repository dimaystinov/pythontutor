{{ task_hints|json_script:"tutor-hints-data" }}
<section class="task-hints" aria-label="Подсказки к задаче">
  <h3>Нужна подсказка?</h3>
  {% for hint in task_hints %}
  <details class="task-hint">
    <summary>Подсказка {{ forloop.counter }}</summary>
    <p>{{ hint.text }}</p>
    {% if hint.example %}<pre>{{ hint.example }}</pre>{% endif %}
  </details>
  {% endfor %}
</section>
