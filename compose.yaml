name: pythontutor
services:
  web:
    build: .
    image: pythontutor-web:local
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Run python3 scripts/setup.py first}
      DEBUG: "0"
      EXECUTION_MODE: ${EXECUTION_MODE:-browser}
      TUTOR_TTS_PROVIDER: ${TUTOR_TTS_PROVIDER:-nvidia}
      TUTOR_NVIDIA_API_KEY: ${TUTOR_NVIDIA_API_KEY:-}
      TUTOR_YANDEX_SPEECHKIT_API_KEY: ${TUTOR_YANDEX_SPEECHKIT_API_KEY:-}
      TUTOR_YANDEX_SPEECHKIT_VOICE: ${TUTOR_YANDEX_SPEECHKIT_VOICE:-marina}
      TUTOR_AI_API_KEY: ${TUTOR_AI_API_KEY:-}
      TUTOR_AI_BASE_URL: ${TUTOR_AI_BASE_URL:-}
      TUTOR_AI_MODEL: ${TUTOR_AI_MODEL:-}
      TUTOR_AI_FALLBACK_MODEL: ${TUTOR_AI_FALLBACK_MODEL:-}
      TUTOR_AI_DAILY_LIMIT: ${TUTOR_AI_DAILY_LIMIT:-60}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8042,http://127.0.0.1:8042}
      DATABASE_PATH: /app/data/db.sqlite3
      RUNNER_URL: http://runner:8081
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Run python3 scripts/setup.py first}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-0}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8042}:8000"
    volumes:
      - tutor-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 45s
  runner:
    profiles: [server]
    build:
      context: .
      dockerfile: runner/Dockerfile
    image: pythontutor-runner:local
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Run python3 scripts/setup.py first}
      RUNNER_IMAGE: pythontutor-worker:local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 5
networks:
  frontend:
  backend:
    internal: true
volumes:
  tutor-data:
