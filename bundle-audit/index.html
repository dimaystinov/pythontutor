<!doctype html><meta charset="utf-8"><title>Offline bundle audit</title>
<script src="../static/pwa/model-assets.js"></script><script src="../static/pwa/local-ai.js"></script><script src="../static/pwa/local-voice.js"></script>
<button id="import">Verify and import cached model through TAR parser</button><button id="ask">Ask local 7B</button><button id="voice">Prepare local voice</button><button id="transcribe">Transcribe Russian sample</button><pre id="log"></pre>
<script>
document.querySelector('#transcribe').onclick=async()=>{try{const bytes=await (await fetch('voice.pcm')).arrayBuffer();say(await TutorLocalVoice.transcribe([new Int16Array(bytes)],16000,say));}catch(e){say(String(e));}};
const log=document.querySelector('#log');const say=s=>log.textContent+=s+'\n';
document.querySelector('#import').onclick=async()=>{try{
const m=await (await fetch('../static/pwa/model-assets.json')).json();
for(const f of m.files.filter(x=>x.group==='qwen7b')){
 const cache=await caches.open(f.cache),keys=await cache.keys();const name=f.path.split('/').pop().replace('ndarray-cache.json','tensor-cache.json');
 const key=keys.find(k=>!k.url.includes('/static/models/')&&(name==='model.wasm'?k.url.includes('Qwen2-7B-Instruct-q4f16_1_cs1k-webgpu.wasm'):k.url.includes('Qwen2.5-Coder-7B-Instruct-q4f16_1-MLC')&&k.url.endsWith('/'+name)));
 if(!key){say(JSON.stringify(keys.map(k=>k.url)));throw Error('Missing cached '+f.path);}
 const body=await (await cache.match(key)).blob(),h=new Uint8Array(512),e=new TextEncoder();h.set(e.encode(f.path));h.set(e.encode(body.size.toString(8).padStart(11,'0')+'\0'),124);h.fill(32,148,156);h[156]=48;h.set(e.encode(h.reduce((a,b)=>a+b,0).toString(8).padStart(6,'0')+'\0 '),148);
 await TutorModelAssets.importFiles([new Blob([h,body,new Uint8Array((512-body.size%512)%512),new Uint8Array(1024)])]);say('PASS '+f.path);
}say('ALL IMPORTED');}catch(e){say('ERROR '+(e.stack||String(e)))}};
document.querySelector('#ask').onclick=async()=>{try{say(await TutorLocalAI.answer('Qwen2.5-Coder-7B-Instruct-q4f16_1-MLC',{question:'Почему для a=3 и b=5 получается 7, а надо 7.5?',context:'Задача «Площадь прямоугольного треугольника». Считать два катета, вывести площадь.',code:'a=int(input())\nb=int(input())\nprint(a*b//2)',turns:[],solved:false},say));}catch(e){say('ERROR '+(e.stack||String(e)))}};
document.querySelector('#voice').onclick=async()=>{try{await TutorLocalVoice.prepare(say);say('VOICE READY');}catch(e){say('ERROR '+(e.stack||String(e)))}};
</script>
