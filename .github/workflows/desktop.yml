name: Desktop installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
          - os: macos-15
            asset: macos-arm64
          - os: macos-15-intel
            asset: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s desktop -p 'test_*.py'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name PythonTutor --distpath desktop-dist desktop/installer.py
      - name: Package
        shell: python
        run: |
          import pathlib, shutil, subprocess, sys
          out=pathlib.Path('desktop-artifacts');out.mkdir()
          if sys.platform=='win32':
              subprocess.run(['desktop-dist/PythonTutor.exe','--self-test'],check=True,timeout=30)
              shutil.copy2('desktop-dist/PythonTutor.exe',out/'PythonTutor-windows-x64.exe')
          else:
              subprocess.run(['desktop-dist/PythonTutor.app/Contents/MacOS/PythonTutor','--self-test'],check=True,timeout=30)
              shutil.make_archive(str(out/'PythonTutor-${{ matrix.asset }}'),'zip','desktop-dist','PythonTutor.app')
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: desktop-artifacts/*
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts
      - run: python desktop/publish.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
