name: PythonTutor Tauri
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tutorial/static/js/assistant.js', 'tutorial/static/pwa/**', 'tutorial/static/tests/**', 'desktop-tauri/**', 'scripts/build_pages.py', 'tutorial/management/commands/seed_course.py', '.github/workflows/tauri.yml']
concurrency:
  group: tauri-installers
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: macos-15
            bundle: dmg
          - os: macos-15-intel
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - run: python -m pip install 'Django>=5.2,<5.3' whitenoise requests Pillow
      - run: python desktop-tauri/prepare.py
      - run: node desktop-tauri/test-frontend.cjs
      - run: node --test tutorial/static/tests/assistant-native.test.cjs tutorial/static/tests/assistant-behavior.test.cjs tutorial/static/tests/opencode.test.cjs tutorial/static/tests/sidebar-menu.test.cjs tutorial/static/tests/speech-adapter.test.cjs tutorial/static/tests/chat-history.test.cjs tutorial/static/tests/component-install-ui.test.cjs desktop-tauri/test-updates.cjs desktop-tauri/test-components.cjs tutorial/static/tests/guidance.test.cjs tutorial/static/tests/speech-progress.test.cjs tutorial/static/tests/model-download.test.cjs
      - run: npm ci
        working-directory: desktop-tauri
      - run: cargo test --locked
        working-directory: desktop-tauri/src-tauri
      - run: npm run build -- --bundles ${{ matrix.bundle }}
        working-directory: desktop-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: native-artifacts
      - run: python desktop-tauri/publish.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
